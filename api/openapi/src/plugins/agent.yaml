paths:
  /api/agent_catalog/v1alpha1/agents:
    description: >-
      The REST endpoint/path used to list zero or more `Agent` entities.
    get:
      summary: List agents.
      tags:
        - AgentCatalogService
      parameters:
        - name: name
          description: Filter agents by name using SQL LIKE pattern matching.
          schema:
            type: string
          in: query
          required: false
        - name: q
          description: Free-form keyword search across name, description, and framework.
          schema:
            type: string
          in: query
          required: false
        - name: sourceLabel
          description: |-
            Filter agents by the label associated with the source. Multiple
            values can be separated by commas.
          schema:
            type: array
            items:
              type: string
          in: query
          required: false
        - $ref: "#/components/parameters/agentFilterQuery"
        - $ref: "#/components/parameters/pageSize"
        - $ref: "#/components/parameters/orderBy"
        - $ref: "#/components/parameters/sortOrder"
        - $ref: "#/components/parameters/nextPageToken"
      responses:
        "200":
          $ref: "#/components/responses/AgentListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: findAgents

  /api/agent_catalog/v1alpha1/agents/filter_options:
    description: Lists options for `filterQuery` when listing agents.
    get:
      summary: Lists fields and values that can be used for filtering.
      tags:
        - AgentCatalogService
      responses:
        "200":
          $ref: "#/components/responses/FilterOptionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getAgentFilterOptions

  /api/agent_catalog/v1alpha1/agents/{agent_id}:
    description: >-
      The REST endpoint/path used to get a single `Agent` entity.
    get:
      summary: Get an `Agent`.
      tags:
        - AgentCatalogService
      responses:
        "200":
          $ref: "#/components/responses/AgentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getAgent
    parameters:
      - name: agent_id
        description: A unique identifier for an `Agent`.
        schema:
          type: string
        in: path
        required: true

  /api/agent_catalog/v1alpha1/sources:
    description: List configured sources for this catalog.
    get:
      summary: List agent catalog sources.
      tags:
        - AgentCatalogService
      responses:
        "200":
          $ref: "#/components/responses/CatalogSourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: findAgentSources

  /api/agent_catalog/v1alpha1/sources/preview:
    description: >-
      Preview an agent catalog source configuration. Accepts a source definition
      and returns a list of agents with their inclusion/exclusion status based on
      the configured filters.
    post:
      summary: Preview agent catalog source configuration.
      description: |-
        Accepts an agent catalog source configuration and returns a list of agents
        showing which would be included or excluded based on the configured filters.

        **Two modes of operation:**

        1. **Stateless mode (recommended for new sources):** Upload both `config` and
           `catalogData` files. The agents are read from `catalogData`, enabling preview
           before saving to the server.

        2. **Path mode (for existing sources):** Upload only `config` with a `yamlCatalogPath`
           property. The agents are read from the specified file path on the server.
      tags:
        - AgentCatalogService
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - config
              properties:
                config:
                  type: string
                  format: binary
                  description: |-
                    YAML file containing the agent catalog source configuration.
                    Supports optional includedAgents and excludedAgents filter patterns
                    using `*` wildcard (case-insensitive).
                catalogData:
                  type: string
                  format: binary
                  description: |-
                    Optional YAML file containing the catalog data (agents).
                    When provided, agents are read from this file instead of
                    from the `yamlCatalogPath` in the config.
      parameters:
        - name: pageSize
          in: query
          schema:
            type: string
          description: Maximum number of results to return.
        - name: nextPageToken
          in: query
          schema:
            type: string
          description: Token for pagination.
        - name: filterStatus
          in: query
          schema:
            type: string
            enum:
              - all
              - included
              - excluded
            default: all
          description: Filter results by inclusion status.
      responses:
        "200":
          $ref: "#/components/responses/AgentSourcePreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Unprocessable entity - invalid config or catalog data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: previewAgentCatalogSource

# Parameters (pageSize, orderBy, etc.) and shared responses (BadRequest, etc.)
# are provided by lib/common.yaml during spec assembly. Only plugin-specific
# schemas and responses are defined here.
components:
  parameters:
    agentFilterQuery:
      name: filterQuery
      description: |-
        SQL-like filter expression for advanced filtering.
        Supported fields: framework, agentType, tags.
        Example: `framework = "langgraph" AND agentType = "starter_kit"`.
      schema:
        type: string
      in: query
      required: false

  schemas:
    Agent:
      description: An agent in the agent catalog.
      allOf:
        - $ref: "#/components/schemas/BaseResource"
        - type: object
          required:
            - name
          properties:
            name:
              type: string
              description: Agent identifier. Must be unique within a source.
            source_id:
              type: string
              description: Catalog source that provides this agent.
            displayName:
              type: string
              description: Human-readable display name.
            framework:
              type: string
              description: Agent framework (e.g., langgraph, crewai, autogen, a2a).
            agentType:
              type: string
              description: Catalog classification (e.g., starter_kit).
            tags:
              type: array
              description: Categorization tags for this agent.
              items:
                type: string
            models:
              type: array
              description: Compatible model identifiers.
              items:
                type: string
            logo:
              type: string
              description: Agent or framework logo URL.
            repositoryUrl:
              type: string
              format: uri
              description: URL to the agent source repository.
            publishedDate:
              type: string
              format: date-time
              description: Date when this agent was published.
            readme:
              type: string
              description: Full Markdown documentation for this agent.
            env:
              type: array
              description: Environment variables required or supported by this agent.
              items:
                $ref: "#/components/schemas/AgentEnvVar"
            artifacts:
              type: array
              description: OCI artifacts for agent deployment.
              items:
                $ref: "#/components/schemas/AgentArtifact"

    AgentEnvVar:
      description: An environment variable for agent configuration.
      type: object
      required:
        - name
        - required
      properties:
        name:
          type: string
          description: Environment variable name.
        required:
          type: boolean
          description: Whether this variable is required for the agent to function.

    AgentArtifact:
      description: OCI artifact for agent deployment.
      allOf:
        - $ref: "#/components/schemas/BaseResourceDates"
        - type: object
          required:
            - uri
          properties:
            uri:
              type: string
              format: uri
              description: OCI artifact URI.

    AgentPreviewResult:
      description: Preview result for a single agent showing inclusion status.
      type: object
      required:
        - name
        - included
      properties:
        name:
          type: string
          description: Agent name.
        included:
          type: boolean
          description: Whether this agent would be included based on the configured filters.

    AgentList:
      description: A list of agent entities.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
        nextPageToken:
          type: string
        pageSize:
          type: integer
        size:
          type: integer

  responses:
    AgentListResponse:
      description: A list of agent entities.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentList"
    AgentResponse:
      description: A single agent entity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Agent"
    AgentSourcePreviewResponse:
      description: Preview results for an agent catalog source configuration.
      content:
        application/json:
          schema:
            type: object
            properties:
              agents:
                description: Array of agent preview results.
                type: array
                items:
                  $ref: "#/components/schemas/AgentPreviewResult"
              summary:
                description: Summary of the preview results.
                type: object
                properties:
                  totalCount:
                    type: integer
                  includedCount:
                    type: integer
                  excludedCount:
                    type: integer
